name: Release Components

on:
  release:
    types: [published]

jobs:
  release-microcontroller:
    name: Build and Upload microcontroller
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP of 'microcontroller' directory
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: zip -r "release-microcontroller-${TAG_NAME}.zip" microcontroller

      - name: Upload microcontroller ZIP to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" "release-microcontroller-${TAG_NAME}.zip" --clobber

  release-lang-cli-notebook:
    name: Publish @bscript/lang, @bscript/cli, and @bscript/notebook
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Determine npm dist-tag
        id: npm_tag
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            NPM_TAG=$(node -e '
              const version = process.argv[1];
              const m = version.match(/^\d+\.\d+\.\d+-([0-9A-Za-z-]+)/);
              if (!m) {
                console.error("::error::GitHub pre-release requires a semver prerelease segment (e.g. 2.0.0-alpha.1)");
                process.exit(1);
              }
              if (/^\d+$/.test(m[1])) {
                console.error("::error::Prerelease identifier must not be numeric (" + m[1] + "); use e.g. 2.0.0-alpha.1");
                process.exit(1);
              }
              process.stdout.write(m[1]);
            ' "$TAG_VERSION")
            echo "Pre-release: publishing to npm dist-tag '${NPM_TAG}' (version ${TAG_VERSION})"
          else
            if [[ "$TAG_VERSION" == *-* ]]; then
              echo "::error::Stable GitHub release must not use a prerelease version (${TAG_VERSION}). Mark the release as pre-release or use a stable version."
              exit 1
            fi
            NPM_TAG="latest"
            echo "Stable release: publishing to npm dist-tag 'latest' (version ${TAG_VERSION})"
          fi

          echo "tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify Package Versions Match Tag
        env:
          TAG_VERSION: ${{ steps.npm_tag.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const tagVersion = process.env.TAG_VERSION;
            const workspaces = ["lang", "notebook", "cli"];
            const errors = [];

            for (const workspace of workspaces) {
              const pkg = JSON.parse(fs.readFileSync(`./${workspace}/package.json`, "utf8"));

              if (pkg.version !== tagVersion) {
                errors.push(`${pkg.name}: version ${pkg.version} does not match tag ${tagVersion}`);
              }

              for (const [dep, range] of Object.entries(pkg.dependencies ?? {})) {
                if (dep.startsWith("@bscript/") && range !== tagVersion) {
                  errors.push(`${pkg.name}: dependency ${dep}@${range} must be pinned to ${tagVersion}`);
                }
              }
            }

            if (errors.length > 0) {
              for (const error of errors) console.error(`::error::${error}`);
              process.exit(1);
            }

            console.log(`Version check passed for ${workspaces.join(", ")}: ${tagVersion}`);
          '

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build --workspaces --if-present

      # Published in dependency order (lang -> notebook -> cli) so that a freshly
      # published package can always resolve the @bscript/* versions it depends on.
      - name: Publish @bscript/lang to npm
        working-directory: ./lang
        env:
          NPM_TAG: ${{ steps.npm_tag.outputs.tag }}
          TAG_VERSION: ${{ steps.npm_tag.outputs.version }}
        run: |
          if npm view "@bscript/lang@${TAG_VERSION}" version > /dev/null 2>&1; then
            echo "@bscript/lang@${TAG_VERSION} is already published; skipping."
            exit 0
          fi
          npm publish --tag "$NPM_TAG"

      - name: Publish @bscript/notebook to npm
        working-directory: ./notebook
        env:
          NPM_TAG: ${{ steps.npm_tag.outputs.tag }}
          TAG_VERSION: ${{ steps.npm_tag.outputs.version }}
        run: |
          if npm view "@bscript/notebook@${TAG_VERSION}" version > /dev/null 2>&1; then
            echo "@bscript/notebook@${TAG_VERSION} is already published; skipping."
            exit 0
          fi
          npm publish --tag "$NPM_TAG"

      - name: Publish @bscript/cli to npm
        working-directory: ./cli
        env:
          NPM_TAG: ${{ steps.npm_tag.outputs.tag }}
          TAG_VERSION: ${{ steps.npm_tag.outputs.version }}
        run: |
          if npm view "@bscript/cli@${TAG_VERSION}" version > /dev/null 2>&1; then
            echo "@bscript/cli@${TAG_VERSION} is already published; skipping."
            exit 0
          fi
          npm publish --tag "$NPM_TAG"
